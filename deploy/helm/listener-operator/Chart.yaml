---
apiVersion: v2
name: listener-operator
version: "0.0.0-dev"
appVersion: "0.0.0-dev"
description: "Kubernetes operator for exposing pods through listeners, load balancers and NodePorts. Part of the Stackable Data Platform (SDP)."
home: https://github.com/stackabletech/listener-operator
# One known use of this is the Artifact Hub (AH) listing which shows the logo.
# AH downloads the logo and re-hosts it.
# We opted to not use the project logos (e.g. the Apache Spark logo) here due to trademark concerns.
icon: https://raw.githubusercontent.com/stackabletech/listener-operator/main/.readme/static/borrowed/Icon_Stackable.svg
sources:
  - https://github.com/stackabletech/listener-operator
keywords: ["listener", "load-balancer", "service-discovery", "networking", "kubernetes", "operator"]
maintainers:
  - name: Stackable
    url: https://www.stackable.tech
# Consumed by Artifact Hub, see https://artifacthub.io/docs/topics/annotations/helm/
annotations:
  # The chart package ships no LICENSE file, so Artifact Hub cannot detect this itself.
  artifacthub.io/license: OSL-3.0
  # A link named "support" is rendered highlighted by Artifact Hub. Keep it lowercase.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.stackable.tech/home/stable/listener-operator/
    - name: support
      url: https://github.com/stackabletech/listener-operator/issues
  artifacthub.io/crds: |-
    - kind: ListenerClass
      version: v1alpha1
      name: listenerclasses.listeners.stackable.tech
      displayName: ListenerClass
      description: Defines a policy for how Listeners should be exposed.
    - kind: Listener
      version: v1alpha1
      name: listeners.listeners.stackable.tech
      displayName: Listener
      description: Exposes a set of Pods to the outside world.
    - kind: PodListeners
      version: v1alpha1
      name: podlisteners.listeners.stackable.tech
      displayName: PodListeners
      description: Informs users about Listeners that are bound by a given Pod.
